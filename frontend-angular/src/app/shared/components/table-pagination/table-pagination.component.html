<div class="table-pagination">
  <div class="pagination-size-control">
    <span>Mostrar</span>
    <select class="form-select form-select-sm" [value]="pageSize" (change)="cambiarTamano($event)" aria-label="Cantidad por pagina">
      @for(option of pageSizeOptions; track option){
        <option [value]="option">{{option}}</option>
      }
    </select>
    <span>por pagina</span>
  </div>

  <div class="pagination-summary">
    {{desde()}} - {{hasta()}} de {{totalItems}}
  </div>

  <div class="btn-group btn-group-sm pagination-actions" role="group" aria-label="Paginacion">
    <button type="button" class="btn btn-outline-secondary" [disabled]="paginaActual() <= 1" (click)="irA(paginaActual() - 1)">
      <i class="bi bi-chevron-left"></i>
    </button>
    <button type="button" class="btn btn-outline-secondary" disabled>
      {{paginaActual()}} / {{totalPaginas()}}
    </button>
    <button type="button" class="btn btn-outline-secondary" [disabled]="paginaActual() >= totalPaginas()" (click)="irA(paginaActual() + 1)">
      <i class="bi bi-chevron-right"></i>
    </button>
  </div>
</div>
